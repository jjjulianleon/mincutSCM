<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Min-cut de cables submarinos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1b1f; --muted: #6b6b76; --line: #e4e4e0;
    --accent: #0b6bcb; --cut: #e5484d; --step: #f59e0b; --prev: #3b82f6; --ok: #2f9e44;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
  #map { height: 100%; background: #dfe8ee; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 4px; padding: 10px 18px 0; }
  .tabs button, .seg button { border: 1px solid var(--line); background: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; color: var(--ink); }
  .tabs button.on, .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .seg { display: flex; } .seg button { border-radius: 0; font-size: 12px; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; }
  #panel { overflow-y: auto; padding: 14px 18px 30px; flex: 1; }
  h2 { font-size: 15px; margin: 4px 0 10px; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 0 6px; }
  .q { background: #f3f6fb; border-left: 3px solid var(--accent); padding: 8px 10px; border-radius: 4px; font-size: 13px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .stat b { display: block; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat.cut b { color: var(--cut); }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 12px; background: #fff4e5; color: #8a4b00; }
  .badge.ok { background: #e9f7ec; color: #1f6e31; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; margin: 0 4px 6px 0; cursor: pointer; font-size: 12px; background: #fff; }
  .chip.cut { border-color: var(--cut); color: var(--cut); }
  .route { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; border: 1px solid transparent; }
  .route:hover, .route.on { background: #f4f4f1; border-color: var(--line); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .cab { font-weight: 600; } .inv { color: var(--step); font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .stepper button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .stepper button:disabled { opacity: .4; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 5px 6px; border-bottom: 1px solid #f0f0ec; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; } tr.row:hover, tr.row.on { background: #f4f4f1; }
  .bars { position: relative; height: 8px; background: #eee; border-radius: 4px; min-width: 80px; }
  .bars i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .bars .n { background: #c9d6e3; } .bars .m { background: var(--cut); }
  input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; margin-bottom: 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .legend { position: absolute; z-index: 500; right: 12px; bottom: 22px; background: rgba(255,255,255,.95); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .legend div { display: flex; align-items: center; gap: 6px; } .legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; }
  footer { padding: 8px 18px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; height: auto; min-height: 100vh; }
    #map { grid-row: 1; height: 45vh; } aside { grid-row: 2; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header>
      <h1>¿Cuántos cables tienen que fallar?</h1>
      <div class="sub">Min-cut sobre la red de cables submarinos · CMP-4007</div>
    </header>
    <div class="tabs" id="tabs">
      <button data-t="1" class="on">Literal 1</button>
      <button data-t="2">Literal 2</button>
      <button data-t="3">Literal 3</button>
      <button data-t="m">Modelo</button>
    </div>
    <div class="bar">
      <div class="seg" id="esc">
        <button data-e="servicio" class="on">Solo en servicio</button>
        <button data-e="planeados">Con planeados</button>
      </div>
      <span class="muted" id="fecha"></span>
    </div>
    <div id="panel"></div>
    <footer>Datos: <a href="https://www.submarinecablemap.com" target="_blank" rel="noopener">TeleGeography Submarine Cable Map</a> (CC BY-SA 4.0).</footer>
  </aside>
  <div style="position:relative">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
